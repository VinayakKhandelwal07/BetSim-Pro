<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BetSim Pro – Sign In</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="login-page">

  <div class="login-container" data-testid="login-container">
    <div class="login-card" data-testid="login-card">

      <div class="login-logo" data-testid="login-logo">⚡ BetSim Pro</div>
      <h2 class="login-title">Sign In</h2>
      <p class="login-subtitle">Enter your credentials to continue</p>

      <form id="loginForm" data-testid="login-form" novalidate>

        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            data-testid="login-username"
            class="form-input"
            placeholder="Enter username"
            autocomplete="username"
            required
          />
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            data-testid="login-password"
            class="form-input"
            placeholder="Enter password"
            autocomplete="current-password"
            required
          />
        </div>

        <div class="login-error" id="loginError" data-testid="login-error" style="display:none;">
          Invalid username or password. Please try again.
        </div>

        <button type="submit" class="btn-login" data-testid="login-submit-btn">
          Sign In
        </button>

      </form>

      <p class="auth-switch-text">
        Don't have an account? <a href="signup.html" class="auth-switch-link">Create one</a>
      </p>

      <div class="login-hint" data-testid="login-credentials-hint">
        <span class="hint-label">Demo credentials</span>
        <div class="hint-row">
          <span>Username:</span>
          <code data-testid="hint-username">admin</code>
        </div>
        <div class="hint-row">
          <span>Password:</span>
          <code data-testid="hint-password">password</code>
        </div>
      </div>

    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    'use strict';
    // Already logged in → skip to home
    if (isLoggedIn()) { window.location.href = 'home.html'; }

    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const username  = document.getElementById('username').value.trim();
      const password  = document.getElementById('password').value;
      const errorEl   = document.getElementById('loginError');

      errorEl.style.display = 'none';

      if (!username || !password) {
        errorEl.textContent = 'Please enter both username and password.';
        errorEl.style.display = '';
        return;
      }

      if (login(username, password)) {
        window.location.href = 'home.html';
      } else {
        errorEl.textContent = 'Invalid username or password. Please try again.';
        errorEl.style.display = '';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    });
  </script>
</body>
</html>
